name: CourtsideCompanion
options:
  bundleIdPrefix: com.courtside
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  CourtsidePhone:
    type: application
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtside.companion
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Courtside
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your private Courtside server on the same network.
        NSCameraUsageDescription: Use your camera only when you start live analysis in Courtside.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: CourtsideWatch
        embed: true
  CourtsideWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtside.companion.watch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Courtside
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.courtside.companion
schemes:
  CourtsidePhone:
    build:
      targets:
        CourtsidePhone: all
        CourtsideWatch: all
  CourtsideWatch:
    build:
      targets:
        CourtsideWatch: all
