name: QA
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -c requirements.lock -e ".[vision,dev]"
      - run: npm ci
      - run: python data/download_model.py
      - run: npm test
      - run: npm run build
      - run: python -m ruff check src api worker tests eval
      - run: python -m mypy src/courtside api worker
      - run: python -m pytest --cov --cov-report=xml --junitxml=test-results/python.xml
      - run: courtside doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: |
            test-results/python.xml
            coverage.xml
